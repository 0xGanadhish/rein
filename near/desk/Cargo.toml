[package]
name = "desk"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `unstable` exposes `env::ecrecover` (a stable host function on mainnet).
near-sdk = { workspace = true, features = ["unstable"] }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
near-workspaces = "0.24.0"
near-sandbox = "0.4.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
secp256k1 = { version = "0.27", features = ["recovery"] }

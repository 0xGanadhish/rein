name = "rein-worker"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[ratelimits]]
name = "QUOTE_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[triggers]
crons = ["* * * * *"]

[vars]
NEAR_NETWORK = "testnet"
DESK_ACCOUNT = "rein-desk.testnet"
AGENT_ACCOUNT = "agent.rein-desk.testnet"
# Allowance the agent's function-call key was added with, in yoctoNEAR (0.25 NEAR, near-cli's default). Match the real key.
AGENT_KEY_ALLOWANCE = "250000000000000000000000"

[[d1_databases]]
binding = "DB"
database_name = "rein"
database_id = "1698ac99-3fd8-45cf-bfef-efc88452acf6"
migrations_dir = "migrations"

# Secrets, set with `wrangler secret put`: AGENT_KEY, NEAR_AI_API_KEY, EXECUTOR_KEY,
# RPC_MONAD, RPC_MONAD_TESTNET, RPC_BASE, RPC_BASE_SEPOLIA, PINGPAY_API_KEY, KICK_TOKEN.
